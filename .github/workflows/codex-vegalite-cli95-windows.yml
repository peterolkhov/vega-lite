name: Vega-Lite exact CLI95 Windows symlink checkout
on:
  push:
    branches: [codex/verify-vegalite-cli95-windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Preserve exact Git checkout bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: vega/vega-lite
          ref: 220ee2c74652d686a4baf01b2d1a00c25644bd48
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
      - name: Initialize runner temporary paths
        shell: bash
        run: |
          echo "NEW95_PACKET=$RUNNER_TEMP/new95-packet" >> "$GITHUB_ENV"
          echo "NEW95_RECEIPTS=$RUNNER_TEMP/new95-cli-receipts" >> "$GITHUB_ENV"
      - name: Diagnose Windows source representation before guarded execution
        shell: bash
        working-directory: target
        run: |
          python3 - <<'WINDOWS_SOURCE_REPRESENTATION'
          import os, subprocess, hashlib, json
          from pathlib import Path
          print('WINDOWS_GIT_SYMLINKS', subprocess.check_output(['git','config','--show-origin','--get','core.symlinks']).decode().strip())
          mismatches=[]
          for entry in subprocess.check_output(['git','ls-files','--stage','-z']).split(b'\0'):
              if not entry: continue
              meta, name=entry.split(b'\t',1); mode, blob, stage=meta.split(); path=Path(os.fsdecode(name))
              if path.is_symlink():
                  value=os.readlink(path); data=os.fsencode(value)
              else:
                  value=None; data=path.read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest().encode()
              if actual!=blob or mode==b'120000':
                  mismatches.append({'path':str(path),'mode':mode.decode(),'is_symlink':path.is_symlink(),'readlink':value,'expected_blob':blob.decode(),'actual_blob':actual.decode(),'bytes':len(data),'mismatch':actual!=blob})
          print('WINDOWS_SOURCE_REPRESENTATION '+json.dumps(mismatches))
          WINDOWS_SOURCE_REPRESENTATION
      - name: Create packet directory
        shell: bash
        run: mkdir -p "$NEW95_PACKET"
      - name: Materialize fix.patch
        shell: bash
        run: |
          cat > "$NEW95_PACKET/fix.patch" <<'NEW95_PAYLOAD_0'
          --- a/src/compile/data/lookup.ts
          +++ b/src/compile/data/lookup.ts
          @@ -103,7 +103,7 @@
                 key: this.transform.from.key,
                 fields: [this.transform.lookup],
                 ...foreign,
          -      ...(this.transform.default ? {default: this.transform.default} : {}),
          +      ...(this.transform.default !== undefined ? {default: this.transform.default} : {}),
               };
             }
           }
          --- a/test/compile/data/lookup.test.ts
          +++ b/test/compile/data/lookup.test.ts
          @@ -76,6 +76,54 @@
                 key: 'name',
                 fields: ['person'],
                 as: ['foo'],
          +    });
          +  });
          +
          +  describe.each(['flat', 'nested'])('%s lookup defaults', (form) => {
          +    it.each([0, false, '', null, 7, 'unknown'])('should preserve default %j', (defaultValue) => {
          +      const lookup = new LookupNode(
          +        null,
          +        {
          +          lookup: 'person',
          +          from: {
          +            data: {url: 'data/lookup_people.csv'},
          +            key: 'name',
          +            ...(form === 'flat' ? {fields: ['age']} : {}),
          +          },
          +          as: 'foo',
          +          default: defaultValue,
          +        },
          +        'lookup_0',
          +      );
          +
          +      expect(lookup.assemble()).toEqual({
          +        type: 'lookup',
          +        from: 'lookup_0',
          +        key: 'name',
          +        fields: ['person'],
          +        ...(form === 'flat' ? {values: ['age']} : {}),
          +        as: ['foo'],
          +        default: defaultValue,
          +      });
          +    });
          +
          +    it('should omit an undefined default', () => {
          +      const lookup = new LookupNode(
          +        null,
          +        {
          +          lookup: 'person',
          +          from: {
          +            data: {url: 'data/lookup_people.csv'},
          +            key: 'name',
          +            ...(form === 'flat' ? {fields: ['age']} : {}),
          +          },
          +          as: 'foo',
          +          default: undefined,
          +        },
          +        'lookup_0',
          +      );
          +
          +      expect(lookup.assemble()).not.toHaveProperty('default');
               });
             });
           
          NEW95_PAYLOAD_0
      - name: Materialize publisher-manifest.json
        shell: bash
        run: |
          cat > "$NEW95_PACKET/publisher-manifest.json" <<'NEW95_PAYLOAD_1'
          {
            "base_pin": "220ee2c74652d686a4baf01b2d1a00c25644bd48",
            "base_tree": "d1067e4185fbea511ea89e789ff6e3cf8803a17e",
            "files": [
              {
                "path": "src/compile/data/lookup.ts",
                "source_file": "source-files/src__compile__data__lookup.ts",
                "mode": "100644",
                "original_git_blob": "5caba2da5e739180abee73d42b3b3561ee24751f",
                "original_sha256": "4df54decb01bf3da34d498c2ef62c01fe0d3598dab2f95e2aa284562531f74fe",
                "after_git_blob": "951881afa89f68661e461d0527f87dd40d323130",
                "after_sha256": "4df24d183d7601b0a2219c81269781fafc9250911684b7378ee34e327f133188"
              },
              {
                "path": "test/compile/data/lookup.test.ts",
                "source_file": "source-files/test__compile__data__lookup.test.ts",
                "mode": "100644",
                "original_git_blob": "0cf4536f5134264ce8a986b54ffdd8af513833fe",
                "original_sha256": "74e04180231e0180cb292fa030bf72d0673fe45d032b450b0f0e1dc1ff8b8e31",
                "after_git_blob": "27919ed0506d93b54fdec5e91d1a8615d693c62d",
                "after_sha256": "c56705202ad966a76757527e59242c01ba23de361d96e255fa8ee96205a4ca94"
              }
            ],
            "candidate_tree": "e32e84a62f8138bad309be5bb28d952b929ecf0b"
          }
          NEW95_PAYLOAD_1
      - name: Materialize frozen-public-probe.mjs
        shell: bash
        run: |
          cat > "$NEW95_PACKET/frozen-public-probe.mjs" <<'NEW95_PAYLOAD_2'
          // UNEXECUTED: public whole-project compiler plus native Vega dataflow only.
          import {writeFileSync} from 'node:fs';
          import {compile} from './build/index.js';
          import {View, parse, version as vegaVersion} from 'vega';
          
          const cases = [
            {name: 'zero', supplied: true, value: 0, expected: 0},
            {name: 'false', supplied: true, value: false, expected: false},
            {name: 'empty-string', supplied: true, value: '', expected: ''},
            {name: 'explicit-null-control', supplied: true, value: null, expected: null},
            {name: 'omitted-control', supplied: false, expected: null},
            {name: 'nonzero-control', supplied: true, value: 7, expected: 7},
            {name: 'string-control', supplied: true, value: 'unknown', expected: 'unknown'},
          ];
          const report = {status: 'infrastructure-error', node: process.version, vegaVersion, cases: [], checks: []};
          function check(name, pass, observed, expected) {
            report.checks.push({name, pass, observed, expected});
          }
          try {
            for (const form of ['flat', 'nested']) {
              for (const item of cases) {
                const transform = {
                  lookup: 'id',
                  from: {
                    data: {values: [{id: 'matched', score: 42}]},
                    key: 'id',
                    ...(form === 'flat' ? {fields: ['score']} : {}),
                  },
                  as: form === 'flat' ? ['got'] : 'got',
                  ...(item.supplied ? {default: item.value} : {}),
                };
                const input = {
                  data: {values: [{id: 'matched'}, {id: 'missing'}]},
                  transform: [transform],
                  mark: 'text',
                  encoding: {text: {field: 'id', type: 'nominal'}},
                };
                const {spec} = compile(input);
                const lookupSources = spec.data.filter(d => (d.transform ?? []).some(t => t.type === 'lookup'));
                if (lookupSources.length !== 1) throw new Error('Expected exactly one actual compiled lookup dataset');
                const source = lookupSources[0];
                const lookups = source.transform.filter(t => t.type === 'lookup');
                if (lookups.length !== 1) throw new Error('Expected exactly one actual compiled lookup transform');
                const emitted = lookups[0];
                const label = `${form}/${item.name}`;
                if (item.supplied && item.value !== null) {
                  check(`${label}/compiler-preserves-default`,
                    Object.hasOwn(emitted, 'default') && Object.is(emitted.default, item.value),
                    {hasDefault: Object.hasOwn(emitted, 'default'), value: emitted.default ?? null},
                    {hasDefault: true, value: item.value});
                } else {
                  check(`${label}/compiler-null-control`, !Object.hasOwn(emitted, 'default') || emitted.default === null,
                    {hasDefault: Object.hasOwn(emitted, 'default'), value: emitted.default ?? null}, 'absent or null');
                }
                const view = new View(parse(spec), {renderer: 'none'});
                let rows;
                try {
                  await view.runAsync();
                  rows = view.data(source.name).map(d => ({id: d.id, got: d.got}));
                } finally {
                  view.finalize();
                }
                if (rows.length !== 2 || !rows.some(d => d.id === 'matched') || !rows.some(d => d.id === 'missing')) {
                  throw new Error('Native dataflow did not retain both ordinary input rows');
                }
                const match = rows.find(d => d.id === 'matched').got;
                const missing = rows.find(d => d.id === 'missing').got;
                check(`${label}/matched-control`, form === 'flat' ? match === 42 : match?.id === 'matched' && match?.score === 42,
                  match, form === 'flat' ? 42 : {id: 'matched', score: 42});
                check(`${label}/native-fallback`, Object.is(missing, item.expected), missing, item.expected);
                report.cases.push({label, input, emittedLookup: emitted, lookupDataset: source.name, nativeRows: rows});
              }
            }
            report.failures = report.checks.filter(c => !c.pass).map(c => c.name);
            report.status = report.failures.length ? 'product-mismatch' : 'all-controls-and-contracts-pass';
            process.exitCode = report.failures.length ? 1 : 0;
          } catch (error) {
            report.error = {name: error.name, message: error.message, stack: error.stack};
            process.exitCode = 2;
          } finally {
            const raw = JSON.stringify(report, null, 2);
            writeFileSync(process.env.NEW90_REPORT, raw + '\n');
            console.log('NEW90_RAW_JSON_BEGIN\n' + raw + '\nNEW90_RAW_JSON_END');
          }
          NEW95_PAYLOAD_2
      - name: Materialize hosted-driver.py
        shell: bash
        run: |
          cat > "$NEW95_PACKET/hosted-driver.py" <<'NEW95_PAYLOAD_3'
          """UNEXECUTED hosted-only before/after verifier; never imports target code locally."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import shutil
          import subprocess
          import sys
          import time
          
          PIN = '220ee2c74652d686a4baf01b2d1a00c25644bd48'
          BASE_TREE = 'd1067e4185fbea511ea89e789ff6e3cf8803a17e'
          CANDIDATE_TREE = 'e32e84a62f8138bad309be5bb28d952b929ecf0b'
          PROBE_HASH = '6bd2cba6b62a97e2781b7557d617669d7e24d0e55a9afa5bc43b22e511a22e90'
          PACKET = Path(os.environ['NEW95_PACKET']).resolve()
          OUT = Path(os.environ['NEW95_RECEIPTS']).resolve()
          OUT.mkdir(parents=True, exist_ok=True)
          EXPECTED_TREE = BASE_TREE
          RECEIPTS = {'pin': PIN, 'base_tree': BASE_TREE, 'candidate_tree': CANDIDATE_TREE, 'commands': [], 'guards': []}
          NODE_PATH = Path(shutil.which('node')).resolve()
          NODE_HASH = hashlib.sha256(NODE_PATH.read_bytes()).hexdigest()
          PACKET_HASHES = {str(path.relative_to(PACKET)): hashlib.sha256(path.read_bytes()).hexdigest()
                           for path in sorted(PACKET.rglob('*')) if path.is_file()}
          RECEIPTS['node_executable'] = {'path': str(NODE_PATH), 'sha256': NODE_HASH}
          RECEIPTS['packet_sha256'] = PACKET_HASHES
          
          
          def git(*args):
              return subprocess.check_output(['git', *args])
          
          
          def digest(records):
              result = hashlib.sha256()
              count = total = 0
              for name, mode, data in records:
                  for part in (name, mode, str(len(data)).encode(), data):
                      result.update(len(part).to_bytes(8, 'big'))
                      result.update(part)
                  count += 1
                  total += len(data)
              return {'sha256': result.hexdigest(), 'files': count, 'bytes': total}
          
          
          def guard(label):
              assert hashlib.sha256(NODE_PATH.read_bytes()).hexdigest() == NODE_HASH
              assert {str(path.relative_to(PACKET)): hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in sorted(PACKET.rglob('*')) if path.is_file()} == PACKET_HASHES
              assert git('rev-parse', 'HEAD').decode().strip() == PIN
              assert git('rev-parse', 'HEAD^{tree}').decode().strip() == BASE_TREE
              assert git('write-tree').decode().strip() == EXPECTED_TREE
              subprocess.run(['git', 'diff', '--exit-code', '--no-ext-diff'], check=True)
              index = git('ls-files', '--stage', '-z')
              records = []
              for entry in index.split(b'\0'):
                  if not entry:
                      continue
                  meta, raw_path = entry.split(b'\t', 1)
                  mode, blob, stage = meta.split()
                  assert stage == b'0'
                  path = Path(os.fsdecode(raw_path))
                  if mode == b'120000':
                      assert path.is_symlink()
                      data = os.fsencode(os.readlink(path))
                  else:
                      assert mode in (b'100644', b'100755')
                      assert path.is_file() and not path.is_symlink()
                      assert bool(path.stat().st_mode & stat.S_IXUSR) == (mode == b'100755')
                      data = path.read_bytes()
                  actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest().encode()
                  assert actual == blob, 'Tracked bytes differ from pinned index: ' + str(path)
                  records.append((raw_path, mode, data))
              value = {'label': label, 'tree': EXPECTED_TREE, 'tracked': digest(records), 'index_sha256': hashlib.sha256(index).hexdigest()}
              RECEIPTS['guards'].append(value)
              print('NEW95_SOURCE_GUARD ' + json.dumps(value), flush=True)
              return value
          
          
          def runtime_snapshot():
              paths = sorted([Path('.new90-before.mjs'), *Path('build').rglob('*'), *Path('node_modules').rglob('*')])
              records = []
              for path in paths:
                  if path.is_symlink():
                      records.append((os.fsencode(path), b'link', os.fsencode(os.readlink(path))))
                  elif path.is_file():
                      records.append((os.fsencode(path), b'file', path.read_bytes()))
              return digest(records)
          
          
          def run(name, argv, timeout=600, stdin=None, binary_output=False):
              started = time.time()
              path = OUT / (name + '.log')
              with path.open('wb') as stream:
                  try:
                      result = subprocess.run(argv, input=stdin, stdout=stream, stderr=subprocess.STDOUT, timeout=timeout)
                      code = result.returncode
                  except subprocess.TimeoutExpired:
                      code = 124
              raw = path.read_bytes()
              value = {'name': name, 'argv': argv, 'exit_code': code, 'seconds': round(time.time() - started, 3),
                       'log_sha256': hashlib.sha256(raw).hexdigest(), 'log_bytes': len(raw)}
              RECEIPTS['commands'].append(value)
              print('NEW95_COMMAND ' + json.dumps(value), flush=True)
              if binary_output:
                  print('NEW95_RAW_BINARY_SAVED ' + str(path) + ' ' + json.dumps(value), flush=True)
              else:
                  print('NEW95_RAW_LOG_BEGIN ' + name + '\n' + raw.decode(errors='replace') + '\nNEW95_RAW_LOG_END ' + name, flush=True)
              guard('after-' + name)
              return code
          
          
          def probe(phase):
              frozen = (PACKET / 'frozen-public-probe.mjs').read_bytes()
              assert hashlib.sha256(frozen).hexdigest() == PROBE_HASH
              Path('.new90-before.mjs').write_bytes(frozen)
              os.environ['NEW90_REPORT'] = str(OUT / ('public-api-' + phase + '.json'))
              before = runtime_snapshot()
              print('NEW95_RUNTIME_BEFORE ' + phase + ' ' + json.dumps(before), flush=True)
              code = run('public-api-' + phase, ['node', '.new90-before.mjs'], 180)
              after = runtime_snapshot()
              print('NEW95_RUNTIME_AFTER ' + phase + ' ' + json.dumps(after), flush=True)
              RECEIPTS['runtime_' + phase] = {'before': before, 'after': after}
              raw = Path(os.environ['NEW90_REPORT']).read_bytes()
              RECEIPTS['public_api_' + phase + '_sha256'] = hashlib.sha256(raw).hexdigest()
              assert before == after, 'Consumed runtime/build/probe bytes changed during native execution'
              assert code in (0, 1), 'Public probe infrastructure error'
              report = json.loads(raw)
              assert report['node'] == 'v24.11.0' and report['vegaVersion'] == '6.4.0'
              assert len(report['cases']) == 14 and len(report['checks']) == 42
              Path('.new90-before.mjs').unlink()
              return code, report
          
          
          exit_code = 2
          try:
              initial = guard('original-initial')
              assert git('hash-object', 'package-lock.json').decode().strip() == '741ac7f6ceea446aa88eb2006ac0611ff424be84'
              assert run('node-version', ['node', '--version'], 30) == 0
              assert subprocess.check_output(['node', '--version']).decode().strip() == 'v24.11.0'
              assert run('npm-version', ['npm', '--version'], 30) == 0
              assert run('install', ['npm', 'ci', '--no-audit', '--no-fund'], 900) == 0
              assert run('original-build', ['npm', 'run', 'build:only'], 900) == 0
              assert run('original-focused-tests', ['./node_modules/.bin/vitest', 'run', '--project', 'unit',
                  'test/compile/data/lookup.test.ts', 'test/compile/selection/parse.test.ts'], 300) == 0
              before_code, before = probe('before')
              # Raw logs/JSON and statuses have already been printed; now assess exact frozen oracles.
              expected_failures = {f'{form}/{value}/{check}' for form in ('flat', 'nested')
                                   for value in ('zero', 'false', 'empty-string')
                                   for check in ('compiler-preserves-default', 'native-fallback')}
              assert before_code == 1 and before['status'] == 'product-mismatch'
              assert set(before['failures']) == expected_failures
              assert sum(item['pass'] for item in before['checks']) == 30
              assert guard('original-final') == {**initial, 'label': 'original-final'}
          
              patch = (PACKET / 'fix.patch').read_bytes()
              manifest = json.loads((PACKET / 'publisher-manifest.json').read_text())
              assert manifest['candidate_tree'] == CANDIDATE_TREE
              assert run('patch-check', ['git', 'apply', '--check', '-'], stdin=patch) == 0
              # Mutation is explicit and bounded to the source-only reviewed candidate tree.
              subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
              EXPECTED_TREE = CANDIDATE_TREE
              candidate = guard('candidate-initial')
              for item in manifest['files']:
                  assert hashlib.sha256(Path(item['path']).read_bytes()).hexdigest() == item['after_sha256']
              assert run('candidate-build', ['npm', 'run', 'build'], 900) == 0
              assert run('candidate-focused-tests', ['./node_modules/.bin/vitest', 'run', '--project', 'unit',
                  'test/compile/data/lookup.test.ts', 'test/compile/selection/parse.test.ts'], 300) == 0
              after_code, after = probe('after')
              assert after_code == 0 and after['status'] == 'all-controls-and-contracts-pass'
              assert not after['failures'] and all(item['pass'] for item in after['checks'])
              assert [item['input'] for item in before['cases']] == [item['input'] for item in after['cases']]
              assert [item['name'] for item in before['checks']] == [item['name'] for item in after['checks']]
              RECEIPTS['semantic_assessment'] = 'before-12-fail-30-pass-after-42-pass-same-frozen-inputs-and-checks'
          
              checks = [
                  ('data', ['npm', 'run', 'data'], 300),
                  ('typechecks', ['./node_modules/.bin/tsc'], 600),
                  ('full-unit', ['./node_modules/.bin/vitest', 'run', 'test/'], 1200),
                  ('lint', ['npm', 'run', 'lint'], 900),
                  ('schema', ['npm', 'run', 'schema'], 600),
                  ('check-schema', ['bash', 'scripts/check-schema.sh'], 60),
                  ('full-examples', ['./node_modules/.bin/vitest', 'run', 'examples/'], 900),
                  ('browser-install', ['./node_modules/.bin/playwright', 'install', '--with-deps', 'chromium'], 900),
                  ('runtime', ['npm', 'run', 'test:runtime', '--', '--browser.headless'], 1200),
                  ('coverage', ['npm', 'run', 'test:cover'], 1200),
                  ('regenerate-examples', ['npm', 'run', 'build:examples'], 1800),
              ]
              failed = []
              for name, argv, timeout in checks:
                  if run(name, argv, timeout) != 0:
                      failed.append(name)
              assert guard('candidate-final') == {**candidate, 'label': 'candidate-final'}
              RECEIPTS['failed_checks'] = failed
              RECEIPTS['state'] = 'native-results-ready-for-independent-assessment'
              exit_code = 1 if failed else 0
          except Exception as error:
              RECEIPTS['state'] = 'verification-incomplete-no-completion-claim'
              RECEIPTS['error'] = {'type': type(error).__name__, 'message': str(error)}
          finally:
              RECEIPTS['exit_code'] = exit_code
              raw = json.dumps(RECEIPTS, indent=2)
              (OUT / 'process-receipts.json').write_text(raw + '\n')
              print('NEW95_PROCESS_RECEIPTS_BEGIN\n' + raw + '\nNEW95_PROCESS_RECEIPTS_END', flush=True)
          sys.exit(exit_code)
          NEW95_PAYLOAD_3
      - name: Materialize cli-matrix-driver.py
        shell: bash
        run: |
          cat > "$NEW95_PACKET/cli-matrix-driver.py" <<'NEW95_PAYLOAD_4'
          """UNEXECUTED hosted-only cross-platform official CLI checks, same candidate."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          import subprocess
          import sys
          
          PIN = '220ee2c74652d686a4baf01b2d1a00c25644bd48'
          BASE = 'd1067e4185fbea511ea89e789ff6e3cf8803a17e'
          TREE = 'e32e84a62f8138bad309be5bb28d952b929ecf0b'
          PACKET = Path(os.environ['NEW95_PACKET']).resolve()
          OUT = Path(os.environ['NEW95_RECEIPTS']).resolve()
          OUT.mkdir(parents=True, exist_ok=True)
          expected_tree = BASE
          receipts = {'platform': sys.platform, 'commands': [], 'guards': []}
          node = Path(shutil.which('node')).resolve()
          node_hash = hashlib.sha256(node.read_bytes()).hexdigest()
          packet_hashes = {str(p.relative_to(PACKET)): hashlib.sha256(p.read_bytes()).hexdigest()
                           for p in sorted(PACKET.rglob('*')) if p.is_file()}
          receipts['node_executable'] = {'path': str(node), 'sha256': node_hash}
          receipts['packet_sha256'] = packet_hashes
          
          
          def git(*args):
              return subprocess.check_output(['git', *args])
          
          
          def digest(records):
              h = hashlib.sha256()
              count = total = 0
              for name, mode, data in records:
                  for value in (name, mode, str(len(data)).encode(), data):
                      h.update(len(value).to_bytes(8, 'big'))
                      h.update(value)
                  count += 1
                  total += len(data)
              return {'sha256': h.hexdigest(), 'files': count, 'bytes': total}
          
          
          def guard(label):
              assert hashlib.sha256(node.read_bytes()).hexdigest() == node_hash
              assert {str(p.relative_to(PACKET)): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(PACKET.rglob('*')) if p.is_file()} == packet_hashes
              assert git('rev-parse', 'HEAD').decode().strip() == PIN
              assert git('rev-parse', 'HEAD^{tree}').decode().strip() == BASE
              assert git('write-tree').decode().strip() == expected_tree
              subprocess.run(['git', 'diff', '--exit-code', '--no-ext-diff'], check=True)
              index = git('ls-files', '--stage', '-z')
              records = []
              for item in index.split(b'\0'):
                  if not item:
                      continue
                  meta, raw_path = item.split(b'\t', 1)
                  mode, blob, stage = meta.split()
                  assert stage == b'0'
                  p = Path(os.fsdecode(raw_path))
                  if mode == b'120000':
                      assert p.is_symlink()
                      data = os.fsencode(os.readlink(p))
                  else:
                      assert mode in (b'100644', b'100755') and p.is_file() and not p.is_symlink()
                      if os.name != 'nt':
                          assert bool(p.stat().st_mode & stat.S_IXUSR) == (mode == b'100755')
                      data = p.read_bytes()
                  assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest().encode() == blob
                  records.append((raw_path, mode, data))
              value = {'label': label, 'tree': expected_tree, 'tracked': digest(records), 'index_sha256': hashlib.sha256(index).hexdigest()}
              receipts['guards'].append(value)
              print('NEW95_CLI_SOURCE_GUARD ' + json.dumps(value), flush=True)
              return value
          
          
          def snapshot():
              records = []
              for p in sorted([*Path('build').rglob('*'), *Path('node_modules').rglob('*')]):
                  if p.is_symlink():
                      records.append((os.fsencode(p), b'link', os.fsencode(os.readlink(p))))
                  elif p.is_file():
                      records.append((os.fsencode(p), b'file', p.read_bytes()))
              return digest(records)
          
          
          def run(name, argv, stdin=None, binary=False):
              result = subprocess.run(argv, input=stdin, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=900)
              (OUT / (name + '.stdout')).write_bytes(result.stdout)
              (OUT / (name + '.stderr')).write_bytes(result.stderr)
              row = {'name': name, 'argv': argv, 'exit_code': result.returncode,
                     'stdout_sha256': hashlib.sha256(result.stdout).hexdigest(), 'stdout_bytes': len(result.stdout),
                     'stderr_sha256': hashlib.sha256(result.stderr).hexdigest(), 'stderr_bytes': len(result.stderr)}
              receipts['commands'].append(row)
              print('NEW95_CLI_COMMAND ' + json.dumps(row), flush=True)
              print('NEW95_CLI_STDERR_BEGIN\n' + result.stderr.decode(errors='replace') + '\nNEW95_CLI_STDERR_END', flush=True)
              if not binary:
                  print('NEW95_CLI_STDOUT_BEGIN\n' + result.stdout.decode(errors='replace') + '\nNEW95_CLI_STDOUT_END', flush=True)
              guard('after-' + name)
              assert result.returncode == 0
              return result.stdout
          
          
          code = 2
          try:
              guard('original-initial')
              assert run('node-version', ['node', '--version']).decode().strip() == 'v24.11.0'
              npm = 'npm.cmd' if os.name == 'nt' else 'npm'
              run('install', [npm, 'ci', '--no-audit', '--no-fund'])
              subprocess.run(['git', 'apply', '--index', '-'], input=(PACKET / 'fix.patch').read_bytes(), check=True)
              expected_tree = TREE
              initial = guard('candidate-initial')
              run('candidate-build', [npm, 'run', 'build:only'])
              before = snapshot()
              print('NEW95_CLI_RUNTIME_BEFORE ' + json.dumps(before), flush=True)
              input_data = Path('examples/specs/bar.vl.json').read_bytes()
              for suffix, command in [('vg.json', 'vl2vg'), ('png', 'vl2png'), ('svg', 'vl2svg'), ('pdf', 'vl2pdf')]:
                  for stdin in (False, True) if os.name != 'nt' else (False,):
                      argv = ['node', 'bin/' + command] + (['-p'] if suffix == 'vg.json' else [])
                      if not stdin:
                          argv += ['examples/specs/bar.vl.json']
                      output = run('cli-' + suffix + ('-stdin' if stdin else '-file'), argv,
                                   input_data if stdin else None, binary=suffix != 'vg.json')
                      if suffix == 'vg.json':
                          assert output == Path('examples/compiled/bar.vg.json').read_bytes()
                      else:
                          assert output, 'CLI must produce nonempty native media output'
              after = snapshot()
              print('NEW95_CLI_RUNTIME_AFTER ' + json.dumps(after), flush=True)
              assert before == after
              assert guard('candidate-final') == {**initial, 'label': 'candidate-final'}
              receipts['runtime_before'] = before
              receipts['runtime_after'] = after
              receipts['state'] = 'native-cli-results-ready-for-independent-assessment'
              code = 0
          except Exception as error:
              receipts['state'] = 'verification-incomplete-no-completion-claim'
              receipts['error'] = {'type': type(error).__name__, 'message': str(error)}
          finally:
              receipts['exit_code'] = code
              raw = json.dumps(receipts, indent=2)
              (OUT / 'process-receipts.json').write_text(raw + '\n')
              print('NEW95_CLI_PROCESS_RECEIPTS_BEGIN\n' + raw + '\nNEW95_CLI_PROCESS_RECEIPTS_END', flush=True)
          sys.exit(code)
          NEW95_PAYLOAD_4
      - name: Verify frozen packet hashes
        shell: bash
        run: |
          python3 - <<'NEW95_HASHCHECK'
          import hashlib, json, os
          from pathlib import Path
          p = Path(os.environ["NEW95_PACKET"])
          expected = {'fix.patch': 'e8ca38cf43a1d45da07a911f171c975b5c5edf225aa85c8d69025a8673bcf7c4', 'publisher-manifest.json': 'bd1aac774119f7cbfc03602d6c1dac6ba3e6d6c263a9137bb9e90fd9a1121a2b', 'frozen-public-probe.mjs': '6bd2cba6b62a97e2781b7557d617669d7e24d0e55a9afa5bc43b22e511a22e90', 'hosted-driver.py': 'e9caa0dc4ddfb7c9dcb2623dc317064dcae2bf7a3ea6f4e819ef10b6e776599d', 'cli-matrix-driver.py': 'a73c7694274cae060b0ec8e349842de93d8350d580eba628524f1bea516e4e47'}
          for name, expected_hash in expected.items():
              assert hashlib.sha256((p / name).read_bytes()).hexdigest() == expected_hash, name
          print("NEW95_FROZEN_PACKET " + json.dumps(expected, sort_keys=True), flush=True)
          NEW95_HASHCHECK
